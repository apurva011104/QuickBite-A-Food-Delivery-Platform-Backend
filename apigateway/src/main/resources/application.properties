spring.application.name=apigateway
server.port=9090

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
eureka.instance.prefer-ip-address=true

# CORS for Angular frontend
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# Handle preflight OPTIONS requests
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=authservice
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTHSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=restaurantservice
spring.cloud.gateway.server.webflux.routes[1].uri=lb://RESTAURANTSERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/restaurants/**

spring.cloud.gateway.server.webflux.routes[2].id=menuservice
spring.cloud.gateway.server.webflux.routes[2].uri=lb://MENUSERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/menu/**

spring.cloud.gateway.server.webflux.routes[3].id=cartservice
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CARTSERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/cart/**

spring.cloud.gateway.server.webflux.routes[4].id=orderservice
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ORDERSERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webflux.routes[5].id=paymentservice
spring.cloud.gateway.server.webflux.routes[5].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/payments/**,/wallet/**

spring.cloud.gateway.server.webflux.routes[6].id=deliveryservice
spring.cloud.gateway.server.webflux.routes[6].uri=lb://DELIVERYSERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/agents/**

spring.cloud.gateway.server.webflux.routes[7].id=reviewservice
spring.cloud.gateway.server.webflux.routes[7].uri=lb://REVIEWSERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/reviews/**

spring.cloud.gateway.server.webflux.routes[8].id=notificationservice
spring.cloud.gateway.server.webflux.routes[8].uri=lb://NOTIFICATIONSERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/v1/notifications/**
